[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "siling-voice"
version = "0.1.0"
description = "Local Chinese wake-word and transcription service for Windows"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi==0.162.5", "uvicorn==0.52.1", "numpy==2.5.4",
  "sherpa-onnx==2.0.1", "sounddevice==0.5.6", "pypinyin==0.55.0",
  "soxr==1.1.0", "pydantic==2.14.3",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "ruff==0.17.5", "mypy==2.4.1", "httpx==0.28.1", "build==1.6.1", "pyinstaller==6.22.3"]

[project.scripts]
siling-voice = "siling_voice.cli:main"

[tool.setuptools.packages.find]
where = ["services/voice/src"]

[tool.setuptools.package-data]
siling_voice = ["models.lock.json", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["services/voice/src"]
markers = ["models: real ONNX inference requiring downloaded models"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".evidence", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["services/voice/src/siling_voice"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

