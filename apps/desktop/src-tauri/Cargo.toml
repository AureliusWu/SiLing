[package]
name = "siling-desktop"
version = "0.4.0"
description = "SiLing Windows desktop shell"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

