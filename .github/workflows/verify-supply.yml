name: Verify speech supply
on:
  push:
    paths: [".github/workflows/verify-supply.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download official wheels
        run: |
          mkdir -p supply/wheels supply/models supply/licenses
          python -m pip download -d supply/wheels sherpa-onnx==2.0.1 sounddevice==0.5.6 pypinyin==0.55.0 fastapi==0.162.5 uvicorn==0.49.0 numpy scipy pytest pytest-cov ruff mypy httpx build pyinstaller soxr
      - name: Download and verify official models
        run: |
          curl -fL --retry 3 -o supply/models/kws.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20.tar.bz2
          curl -fL --retry 3 -o supply/models/asr.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-int8-2024-07-17.tar.bz2
          curl -fL --retry 3 -o supply/models/silero_vad.onnx https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
          echo "68447f4fbc67e70eee3a93961f36e81e98f47aef73ce7e7ca00885c6cd3616a6  supply/models/kws.tar.bz2" | sha256sum -c -
          echo "7d1efa2138a65b0b488df37f8b89e3d91a60676e416f515b952358d83dfd347e  supply/models/asr.tar.bz2" | sha256sum -c -
          echo "9e2449e1087496d8d4caba907f23e0bd3f78d91fa552479bb9c23ac09cbb1fd6  supply/models/silero_vad.onnx" | sha256sum -c -
          curl -fL -o supply/licenses/sensevoice-model.txt https://huggingface.co/FunAudioLLM/SenseVoiceSmall/raw/main/LICENSE
          curl -fL -o supply/licenses/kws-card.md https://huggingface.co/csukuangfj/sherpa-onnx-kws-zipformer-zh-en-3M-2025-12-20/raw/main/README.md
          python -m pip index versions uvicorn > supply/versions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: siling-verified-speech-supply
          path: supply
          retention-days: 3
