name: Prepare reproducible development assets
on:
  push:
    paths: [".github/workflows/prepare-dev.yml", "scripts/generate_fixtures.py"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --package-lock-only && npm ci && npm run build
      - run: tar -czf node-runtime.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: siling-node-runtime
          path: |
            node-runtime.tar.gz
            package-lock.json
            apps/desktop/dist
          retention-days: 3
  synthetic-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install sherpa-onnx==2.0.1 numpy==2.5.4
      - name: Download pinned TTS for synthetic QA only
        run: |
          curl -fL --retry 3 -o kokoro.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-int8-multi-lang-v1_1.tar.bz2
          echo "259c9c8bc906d6078e4e0570421885dabb68b539c2f970fcbb890a58eeaf3e9c  kokoro.tar.bz2" | sha256sum -c -
          tar -xjf kokoro.tar.bz2
          ls kokoro-int8-multi-lang-v1_1
          python scripts/generate_fixtures.py kokoro-int8-multi-lang-v1_1 fixtures
      - uses: actions/upload-artifact@v4
        with:
          name: siling-synthetic-fixtures
          path: fixtures
          retention-days: 30
